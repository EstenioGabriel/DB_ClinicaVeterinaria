services:
  db:
    image: mysql:8.0
    container_name: clinica_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinica_veterinaria
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Mapeia o script SQL para rodar automaticamente na primeira inicialização do banco
      - ./00_script_completo.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: clinica_backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: clinica_veterinaria
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: clinica_frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
